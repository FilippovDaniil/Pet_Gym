# ──────────────────────────────────────────────────────────────────────────────
# 00-namespace.yaml — Изолированное пространство имён для всего стека Pet Gym
#
# Namespace = логический раздел кластера. Все ресурсы (Pods, Services, PVC)
# создаются внутри него. Это позволяет:
#   - Изолировать Pet Gym от других проектов в кластере
#   - Легко удалить весь стек одной командой: kubectl delete namespace pet-gym
#
# Порядок применения: ПЕРВЫМ (до всех остальных манифестов)
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: pet-gym        # Имя namespace — используется в поле namespace: всех ресурсов
  labels:
    app: pet-gym       # Метка для удобства фильтрации: kubectl get all -l app=pet-gym
