# ──────────────────────────────────────────────────────────────────────────────
# 03-loki.yaml — Grafana Loki: система агрегации логов
#
# Архитектура логирования Pet Gym:
#   Spring Boot (loki4j appender) → HTTP push → Loki:3100 → Grafana visualizes
#
# loki4j appender настроен в logback-spring.xml:
#   <url>http://loki:3100/loki/api/v1/push</url>
#
# КРИТИЧНО: Имя K8s Service СТРОГО = "loki" (не loki-service, не loki-svc!)
# Иначе logback4j не сможет отправить логи (DNS не разрешится).
#
# Файл содержит 4 ресурса:
#   1. ConfigMap — конфигурация Loki
#   2. PersistentVolumeClaim — хранилище логов
#   3. Deployment — контейнер Loki
#   4. Service (ClusterIP) — внутренний адрес "loki"
# ──────────────────────────────────────────────────────────────────────────────

# ──── ConfigMap: конфигурация Loki ───────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: pet-gym
data:
  # Файл loki.yaml монтируется внутрь контейнера как /etc/loki/loki.yaml
  loki.yaml: |
    auth_enabled: false       # Отключить многопользовательский режим (для локальной разработки)
                              # В production: true (каждый арендатор со своим токеном)

    server:
      http_listen_port: 3100  # HTTP порт — принимает POST от loki4j appender Spring Boot

    common:
      path_prefix: /loki      # Корневая директория данных внутри контейнера
      storage:
        filesystem:
          chunks_directory: /loki/chunks  # Сами данные логов (сжатые chunки)
          rules_directory: /loki/rules    # Правила алертинга (пустая директория если нет алертов)
      replication_factor: 1   # Один узел = одна копия данных (не HA)
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory     # KV-координация в памяти (достаточно для single-node)

    schema_config:
      configs:
        - from: "2024-01-01"  # С какой даты действует эта схема (фиксируем прошедшую дату)
          store: tsdb          # TSDB (Time Series DB) — оптимальный backend для Loki 2.9+
          object_store: filesystem
          schema: v13          # Версия схемы индексов (v13 = текущая рекомендованная)
          index:
            prefix: index_     # Префикс файлов индекса
            period: 24h        # Создавать новый файл индекса каждые 24 часа

    limits_config:
      reject_old_samples: true           # Отклонять логи старше max_age (защита от спама)
      reject_old_samples_max_age: 168h   # Максимальный возраст = 7 дней (168 часов)
      allow_structured_metadata: false   # Отключить structured metadata (не нужно для базового использования)

---
# ──── PersistentVolumeClaim для Loki ─────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-pvc
  namespace: pet-gym
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi    # 2 ГБ хватает на ~7 дней логов при умеренной нагрузке

---
# ──── Deployment Loki ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: pet-gym
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      # КРИТИЧНО: Loki 2.x внутри образа запускается от UID 10001 (loki user),
      # но PVC при создании принадлежит root. Loki не может писать в /loki → Permission denied.
      # Решение: запустить от root (UID 0), как в docker-compose: user: "0"
      securityContext:
        runAsUser: 0    # Запуск от root снимает проблему прав на PVC
      containers:
        - name: loki
          image: grafana/loki:2.9.4    # Стабильная версия (2.9.x — LTS ветка)
          args:
            - -config.file=/etc/loki/loki.yaml   # Указываем путь к конфигурации
          ports:
            - containerPort: 3100      # HTTP порт для приёма логов от loki4j
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki     # Монтируем ConfigMap — внутри будет файл loki.yaml
            - name: loki-data
              mountPath: /loki         # Монтируем PVC — здесь хранятся chunks и rules
          readinessProbe:
            httpGet:
              path: /ready             # Loki отдаёт 200 OK когда готов принимать запросы
              port: 3100
            initialDelaySeconds: 15    # Loki стартует ~10-15 сек
            periodSeconds: 10
            failureThreshold: 6        # 6 × 10 = 60 сек на раскрутку
      volumes:
        - name: loki-config
          configMap:
            name: loki-config         # Берём конфиг из ConfigMap loki-config
        - name: loki-data
          persistentVolumeClaim:
            claimName: loki-pvc       # Постоянное хранилище логов

---
# ──── Service Loki (ClusterIP) ────────────────────────────────────────────────
# ВАЖНО: name: loki — именно так прописано в logback-spring.xml!
# K8s DNS: loki → разрешается в ClusterIP этого Service
# logback-spring.xml: <url>http://loki:3100/loki/api/v1/push</url>
apiVersion: v1
kind: Service
metadata:
  name: loki    # ← СТРОГО "loki" — совпадает с URL в logback-spring.xml
  namespace: pet-gym
spec:
  selector:
    app: loki   # Направляем трафик на Pod-ы с меткой app=loki
  ports:
    - port: 3100
      targetPort: 3100
  type: ClusterIP    # Только внутри кластера (Grafana и Spring Boot обращаются изнутри)
