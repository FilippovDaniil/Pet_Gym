# ──────────────────────────────────────────────────────────────────────────────
# 08-opensearch.yaml — OpenSearch для полнотекстового поиска тренеров
#
# Ресурсы:
#   1. PersistentVolumeClaim opensearch-pvc — хранилище индексов
#   2. Deployment opensearch — контейнер OpenSearch с sysctl initContainer
#   3. Service opensearch-service (ClusterIP) — внутренний доступ для приложения
#
# ⚠️ ВАЖНО:
#   - imagePullPolicy: IfNotPresent (публичный образ — НЕ Never!)
#   - sysctl initContainer обязателен: без него Exit 78 (vm.max_map_count)
#   - Порт сервиса: opensearch-service:9200 (используется в 06-app.yaml ConfigMap)
# ──────────────────────────────────────────────────────────────────────────────

# ──── PersistentVolumeClaim ───────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opensearch-pvc
  namespace: pet-gym
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# ──── Deployment OpenSearch ───────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opensearch
  namespace: pet-gym
  labels:
    app: opensearch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      # ── initContainer: установка vm.max_map_count ──────────────────────────
      # OpenSearch падает с Exit 78 без этой настройки ядра:
      # "max virtual memory areas vm.max_map_count [65530] is too low"
      # privileged: true — единственный способ изменить параметр ядра через sysctl
      initContainers:
        - name: sysctl-fix
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true

      containers:
        - name: opensearch
          image: opensearchproject/opensearch:2.17.0
          # ⚠️ IfNotPresent — публичный образ, k3s тянет из Docker Hub если нет локально
          # Never — только для pet-gym:1.0.0 (загружается вручную через build-and-load.ps1)
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 9200

          env:
            - name: discovery.type
              value: "single-node"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: bootstrap.memory_lock
              value: "false"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms512m -Xmx512m"

          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data

          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12   # 2 минуты на прогрев — OpenSearch стартует медленно

          resources:
            requests:
              memory: "600Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: opensearch-pvc

---
# ──── Service OpenSearch (ClusterIP) ─────────────────────────────────────────
# ClusterIP — OpenSearch доступен только внутри кластера (приложение обращается через DNS)
# Имя сервиса opensearch-service используется в ConfigMap 06-app.yaml:
#   OPENSEARCH_URL: "http://opensearch-service:9200"
apiVersion: v1
kind: Service
metadata:
  name: opensearch-service
  namespace: pet-gym
spec:
  selector:
    app: opensearch
  ports:
    - port: 9200
      targetPort: 9200
  type: ClusterIP
