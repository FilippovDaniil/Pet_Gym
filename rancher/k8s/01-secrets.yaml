# ──────────────────────────────────────────────────────────────────────────────
# 01-secrets.yaml — Зашифрованное хранилище чувствительных данных
#
# Secret vs ConfigMap:
#   ConfigMap → несекретные переменные (URL, порты, флаги)
#   Secret    → пароли, токены, ключи (хранятся в etcd в base64)
#
# stringData: K8s сам конвертирует строки в base64 при сохранении.
# Не нужно делать base64 вручную — это делает kubectl apply.
#
# Ссылка в Deployment: через secretKeyRef → name: pet-gym-secrets
# ──────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: pet-gym-secrets   # Имя Secret — на него ссылается 06-app.yaml через secretKeyRef
  namespace: pet-gym       # Должен быть в том же namespace что и Deployment
type: Opaque               # Тип Opaque = произвольные key-value пары (не JWT, не TLS и т.д.)
stringData:
  # Пароль PostgreSQL — берётся из application.properties (spring.datasource.password=1234)
  # В Deployment передаётся как SPRING_DATASOURCE_PASSWORD через secretKeyRef
  postgres-password: "1234"
