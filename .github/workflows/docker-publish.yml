name: Docker Publish

on:
  push:
    branches:
      - master
    tags:
      - 'v*.*.*'

# Деплои не отменяем — завершаем текущий, потом следующий
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/pet-gym

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Собираем JAR на хосте (быстро, с Gradle-кешем) ─────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build bootJar
        run: ./gradlew bootJar --no-daemon -x test

      - name: Verify JAR
        run: |
          JAR=$(ls build/libs/Pet_Gym-*.jar 2>/dev/null | head -1)
          if [ -z "$JAR" ]; then echo "ERROR: JAR not found"; exit 1; fi
          echo "JAR: $JAR ($(du -sh "$JAR" | cut -f1))"

      # ── 2. Настраиваем Docker ──────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Вычисляем теги ─────────────────────────────────────────────────
      # Стратегия тегов:
      #   v1.2.3  → 1.2.3, 1.2, latest
      #   master  → master, sha-abc1234
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Pet Gym
            org.opencontainers.image.description=Fitness club management backend
            org.opencontainers.image.vendor=${{ github.repository_owner }}

      # ── 4. Собираем и пушим образ ─────────────────────────────────────────
      # Используем .github/Dockerfile.ci — копирует уже собранный JAR
      # (не запускает Gradle внутри Docker → быстрее и стабильнее)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: .github/Dockerfile.ci
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # ── 5. Краткий итог ───────────────────────────────────────────────────
      - name: Print published tags
        run: |
          echo "Published image tags:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'
