name: CI

on:
  push:
    branches:
      - master
      - develop
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - master
      - develop

# Отменяем дублирующие запуски для одной ветки/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (JUnit 5)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon --continue
        env:
          SPRING_PROFILES_ACTIVE: test
          # Заглушки для бинов, которые требуют реальных данных
          ALFABANK_USERNAME: test
          ALFABANK_PASSWORD: test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 14

      - name: Annotate failed tests
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Test Results
          path: build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: false

  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build bootJar
        run: ./gradlew bootJar --no-daemon -x test

      - name: Verify JAR exists
        run: ls -lh build/libs/*.jar

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: pet-gym-jar-${{ github.run_number }}
          path: build/libs/Pet_Gym-*.jar
          retention-days: 7
