spring.application.name=Pet_Gym

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/petgym
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=1234

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

server.port=8091

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

logging.level.com.petgym=INFO

# OpenSearch (Вариант B: отключаемый через enabled=false)
opensearch.enabled=true
opensearch.url=${OPENSEARCH_URL:http://localhost:9200}

# Alfa Bank Payment Gateway
alfabank.gateway.url=https://alfa.rbsuat.com/payment/rest/
alfabank.api.username=${ALFABANK_USERNAME:}
alfabank.api.password=${ALFABANK_PASSWORD:}
alfabank.return-url=${ALFABANK_RETURN_URL:http://localhost:30091/api/payment/callback}
alfabank.fail-url=${ALFABANK_FAIL_URL:http://localhost:30091/api/payment/fail}
