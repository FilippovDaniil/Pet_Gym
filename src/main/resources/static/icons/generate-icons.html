<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Генерация иконок PWA</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
        canvas { border: 1px solid #ccc; margin: 8px; border-radius: 8px; }
        button { margin: 4px; padding: 8px 16px; cursor: pointer; background: #0d6efd; color: #fff; border: none; border-radius: 6px; }
        .note { color: #666; font-size: .9rem; margin-top: 12px; }
    </style>
</head>
<body>
<h2>Генерация PNG-иконок для PWA</h2>
<p>Откройте эту страницу в браузере. Нажмите кнопки чтобы скачать иконки, затем положите их рядом с icon.svg в папку <code>icons/</code>.</p>
<div>
    <canvas id="c192" width="192" height="192"></canvas>
    <canvas id="c512" width="512" height="512"></canvas>
</div>
<div>
    <button onclick="download('c192','icon-192.png')">Скачать icon-192.png</button>
    <button onclick="download('c512','icon-512.png')">Скачать icon-512.png</button>
</div>
<p class="note">
    Файлы кладёте рядом с icon.svg в static/icons/. После этого manifest.json найдёт их автоматически.
</p>
<script>
function drawIcon(canvas) {
    const s = canvas.width;
    const ctx = canvas.getContext('2d');
    const r = s * 0.195; // corner radius ~100/512

    // Background rounded rect
    ctx.fillStyle = '#1a1a2e';
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(s - r, 0);
    ctx.quadraticCurveTo(s, 0, s, r);
    ctx.lineTo(s, s - r);
    ctx.quadraticCurveTo(s, s, s - r, s);
    ctx.lineTo(r, s);
    ctx.quadraticCurveTo(0, s, 0, s - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fill();

    const u = s / 512;

    // Bar
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    roundRect(ctx, 116*u, 236*u, 280*u, 40*u, 20*u);
    ctx.fill();

    // Left outer plate
    ctx.fillStyle = '#0d6efd';
    ctx.beginPath();
    roundRect(ctx, 68*u, 188*u, 72*u, 136*u, 18*u);
    ctx.fill();

    // Left inner plate
    ctx.fillStyle = '#6ea8fe';
    ctx.beginPath();
    roundRect(ctx, 36*u, 208*u, 44*u, 96*u, 14*u);
    ctx.fill();

    // Right outer plate
    ctx.fillStyle = '#0d6efd';
    ctx.beginPath();
    roundRect(ctx, 372*u, 188*u, 72*u, 136*u, 18*u);
    ctx.fill();

    // Right inner plate
    ctx.fillStyle = '#6ea8fe';
    ctx.beginPath();
    roundRect(ctx, 432*u, 208*u, 44*u, 96*u, 14*u);
    ctx.fill();
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function download(id, filename) {
    const a = document.createElement('a');
    a.download = filename;
    a.href = document.getElementById(id).toDataURL('image/png');
    a.click();
}

drawIcon(document.getElementById('c192'));
drawIcon(document.getElementById('c512'));
</script>
</body>
</html>
